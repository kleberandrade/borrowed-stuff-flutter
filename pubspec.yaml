name: borrowed_stuff
description: An offline lending journal for objects, people and returns.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.10.1
  sembast_web: ^2.4.7
  cupertino_icons: ^2.0.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
