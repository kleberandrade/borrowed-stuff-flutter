name: borrowed_stuff
description: An offline lending journal for objects, people and returns.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.5
  sembast_web: 2.4.4+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
