<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img" aria-label="Quem faz o quê no aplicativo?">
<rect width="100%" height="100%" fill="white"/>
<text x="70" y="105.2" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#18372d">Quem faz o quê no aplicativo?</text>
<text x="70" y="161.6" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#52645c">Leia de cima para baixo: interface → coordenação → persistência.</text>
<rect x="70" y="220" width="770" height="150" rx="20" fill="#e6ede6" stroke="#648c7b" stroke-width="2"/>
<text x="98" y="274.4" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18372d">Telas</text>
<text x="98" y="316.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">HomePage e StuffDetailPage</text>
<text x="98" y="355.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Exibem dados e recebem ações.</text>
