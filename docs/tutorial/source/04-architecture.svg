<text x="788" y="1191.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">databaseFactoryIo</text>
<text x="788" y="1230.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Arquivo borrowed_stuff.db</text>
<text x="70" y="1316.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#52645c">A fábrica é escolhida na abertura. Web e nativo têm bancos separados.</text>
