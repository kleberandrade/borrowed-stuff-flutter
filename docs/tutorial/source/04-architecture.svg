<text x="958" y="274.4" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18372d">Stuff</text>
<text x="958" y="316.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Dados do empréstimo.</text>
<text x="958" y="355.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Valida a nova entrada.</text>
<text x="958" y="394.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">models/stuff.dart</text>
