<polygon points="455.0,640.0 447.3,622.7 462.7,622.7" fill="#285c4b"/>
<rect x="70" y="640" width="770" height="150" rx="20" fill="#e6ede6" stroke="#648c7b" stroke-width="2"/>
<text x="98" y="692.8" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#18372d">LoanRepository → StuffDao</text>
<text x="98" y="736.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">O contrato separa a aplicação do banco.</text>
<text x="98" y="775.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">O DAO implementa as operações Sembast.</text>
<rect x="930" y="485" width="400" height="195" rx="20" fill="#f6f5f0" stroke="#648c7b" stroke-width="2"/>
<text x="958" y="539.4" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18372d">Nos testes</text>
<text x="958" y="581.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Um repositório falso</text>
<text x="958" y="620.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">pode testar a interface.</text>
<text x="958" y="659.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">O DAO tem testes reais.</text>
