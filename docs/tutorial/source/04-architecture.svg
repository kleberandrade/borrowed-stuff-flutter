<rect x="70" y="430" width="770" height="150" rx="20" fill="#e6ede6" stroke="#648c7b" stroke-width="2"/>
<text x="98" y="484.4" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18372d">HomeController</text>
<text x="98" y="526.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Controla busy, error e a lista.</text>
<text x="98" y="565.0" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#18372d">Espera a operação e a nova leitura.</text>
